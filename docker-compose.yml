version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: iprs-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: iprs_db
      MYSQL_USER: iprs_user
      MYSQL_PASSWORD: iprs_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
